<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-магазин</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        /* Скрываем форму по умолчанию */
        .order-form {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Добро пожаловать в наш мини-магазин!</h1>
    </header>
    
    <main>
        <!-- Продукты -->
        <section class="product">
            <img src="images/1.jpg" alt="Товар 1">
            <h2>Товар 1</h2>
            <p>Описание товара 1.</p>
            <p>Цена: 100 руб.</p>
            <button onclick="showOrderForm()">Купить</button>
        </section>

        <section class="product">
            <img src="images/2.jpg" alt="Товар 2">
            <h2>Товар 2</h2>
            <p>Описание товара 2.</p>
            <p>Цена: 200 руб.</p>
            <button onclick="showOrderForm()">Купить</button>
        </section>

        <section class="product">
            <img src="images/1.jpg" alt="Товар 3">
            <h2>Товар 3</h2>
            <p>Описание товара 3.</p>
            <p>Цена: 300 руб.</p>
            <button onclick="showOrderForm()">Купить</button>
        </section>
        
        <!-- Форма заказа -->
        <div id="orderForm" class="order-form">
            <form action="#" method="post">
                <label for="name">Имя:</label><br>
                <input type="text" id="name" name="name"><br>
                
                <label for="surname">Фамилия:</label><br>
                <input type="text" id="surname" name="surname"><br>
                
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br>
                
                <label for="phone">Номер телефона:</label><br>
                <input type="tel" id="phone" name="phone"><br>
                
                <button type="submit">Оформить заказ</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Мини-магазин. Все права защищены.</p>
    </footer>

    <script>
        // Функция показывает форму заказа
        function showOrderForm() {
            document.getElementById('orderForm').style.display = 'block';
        }
    </script>
</body>
</html>
