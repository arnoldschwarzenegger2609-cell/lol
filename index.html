<!DOCTYPE html>
<html lang="ru">

            <h2>Товар 2</h2>
            <p>Описание товара 2.</p>
            <p>Цена: 200 руб.</p>

            <img src="images/1.jpg" alt="Товар 3">
            <h2>Товар 3</h2>
            <p>Описание товара 3.</p>
            <p>Цена: 300 руб.</p>
