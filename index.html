<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-магазин</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        /* Скрываем форму по умолчанию */
        .order-form {
            display: none;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            font-size: 24px;
            color: green;
            font-weight: bold;
            text-align: center;
        }

        .product {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Добро пожаловать в наш мини-магазин!</h1>
    </header>
    
    <main id="productContainer">
        <!-- Продукты -->
        <section class="product">
            <img src="images/1.jpg" alt="Товар 1">
            <h2>Товар 1</h2>
            <p>Описание товара 1.</p>
            <p>Цена: 100 руб.</p>
            <button onclick="buyProduct()">Купить</button>
        </section>

        <section class="product">
            <img src="images/2.jpg" alt="Товар 2">
            <h2>Товар 2</h2>
            <p>Описание товара 2.</p>
            <p>Цена: 200 руб.</p>
            <button onclick="buyProduct()">Купить</button>
        </section>

        <section class="product">
            <img src="images/1.jpg" alt="Товар 3">
            <h2>Товар 3</h2>
            <p>Описание товара 3.</p>
            <p>Цена: 300 руб.</p>
            <button onclick="buyProduct()">Купить</button>
        </section>
        
        <!-- Форма заказа -->
        <div id="orderForm" class="order-form">
            <form id="form" onsubmit="submitOrder(event)">
                <label for="name">Имя:</label><br>
                <input type="text" id="name" name="name" required><br>
                
                <label for="surname">Фамилия:</label><br>
                <input type="text" id="surname" name="surname" required><br>
                
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br>
                
                <label for="phone">Номер телефона:</label><br>
                <input type="tel" id="phone" name="phone" required><br>
                
                <button type="submit">Оформить заказ</button>
            </form>
        </div>

        <!-- Сообщение об успешном заказе -->
        <div id="successMessage" class="success-message">
            ЗАКАЗ УСПЕШНО ОФОРМЛЕН!
        </div>
    </main>

    <footer>
        <p>&copy; 2027 Мини-магазин. Все права защищены.</p>
    </footer>

    <script>
        // Функция скрывает карточки товаров и показывает форму заказа
        function buyProduct() {
            const products = document.querySelectorAll('.product');
            products.forEach(product => product.style.display = 'none');
            
            document.getElementById('orderForm').style.display = 'block';
        }

        // Функция обработки отправки формы
        function submitOrder(event) {
            event.preventDefault(); // Отменяем стандартное поведение формы
            
            // Скрываем форму заказа
            document.getElementById('orderForm').style.display = 'none';
            
            // Показываем сообщение об успешном заказе
            document.getElementById('successMessage').style.display = 'block';
        }
    </script>
</body>
</html>
